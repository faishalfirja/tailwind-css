<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body class="dark bg-slate-950">
        <div class="dark:bg-blue-500 w-20 h-20"></div>
    </body>

    <body class="mt10 bg-white dark:bg-black dark:text-white">
        <div class="flex justify-center">
            <div class="mr-3 text-sm">light</div>
            <input type="checkbox" id="geser" class="hidden" />
            <label for="geser">
            <div
                class="flex h-5 w-10 cursor-pointer items-center rounded-full bg-slate-500 p-1">
            <div
                class="-ml-[3px] h-4 w-4 rounded-full bg-white dark:translate-x-3"></div>
            </div>
            </label>
                <span class="ml-3 text-sm">Dark</span>
        </div>
    </body>
    <script>
        const checkbox = document.querySelector("#geser");
        const html = document.querySelector("html");

        checkbox.addEventListener("click", function () {
            checkbox.checked 
            ? html.classList.add("dark")
            : html.classList.remove("dark");
        });
            function toDT() {
                if localStorage.getItem("theme") === "dark"] {
                    localStorage.setItem("theme", "Light");
                    document.documentElement.classList.remove("dark");
                } else
                    localStorage.setItem("theme", "dark");
                    document.documentElement.classList.add("dark");
                    }
            }
            document.querySelector("button").addEventListener("click", toDT);
            if localStorage,getItem("theme") === "dark") {
                document.documentElement.classList.add("dark");
            }
    </script>
</html>
