<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic 4-Reel Slot</title>
    <style>
        body {
            background-color: #121212;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
        }

        /* Container Utama */
        .slot-machine {
            background: linear-gradient(145deg, #2c3e50, #000);
            padding: 20px;
            border: 8px solid #ffd700;
            border-radius: 15px;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.2);
            text-align: center;
        }

        /* Baris Kolom */
        .reel-container {
            display: flex;
            gap: 10px;
            background: #000;
            padding: 15px;
            border-radius: 8px;
            border: 3px solid #444;
            margin-bottom: 20px;
        }

        /* Gaya Tiap Kolom */
        .reel {
            width: 80px;
            height: 100px;
            background: #fff;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            font-weight: bold;
            overflow: hidden;
            border: 2px solid #888;
            transition: transform 0.1s;
        }

        /* Tombol Putar */
        .spin-button {
            background: linear-gradient(to bottom, #ff4b2b, #ff416c);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px #900;
            text-transform: uppercase;
        }

        .spin-button:active {
            box-shadow: 0 2px #600;
            transform: translateY(3px);
        }

        .spin-button:disabled {
            background: #555;
            box-shadow: none;
            cursor: not-allowed;
        }

        .result-text {
            color: #ffd700;
            margin-top: 15px;
            font-size: 1.2rem;
            height: 1.5rem;
        }

        /* Animasi Bergetar saat Putar */
        .shaking {
            animation: shake 0.1s infinite;
        }

        @keyframes shake {
            0% { transform: translateY(-5px); }
            100% { transform: translateY(5px); }
        }
    </style>
</head>
<body>

    <div class="slot-machine">
        <div class="reel-container">
            <div id="reel1" class="reel">🍒</div>
            <div id="reel2" class="reel">🍋</div>
            <div id="reel3" class="reel">7️⃣</div>
            <div id="reel4" class="reel">💎</div>
        </div>

        <button class="spin-button" onclick="spin()" id="spinBtn">SPIN</button>
        <div class="result-text" id="status">Coba Keberuntunganmu!</div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍇', '7️⃣', '💎', '🔔', '🍀'];
        const reels = [
            document.getElementById('reel1'),
            document.getElementById('reel2'),
            document.getElementById('reel3'),
            document.getElementById('reel4')
        ];
        const statusText = document.getElementById('status');
        const btn = document.getElementById('spinBtn');

        function spin() {
            btn.disabled = true;
            statusText.innerText = "Memutar...";
            
            reels.forEach((reel, index) => {
                // Tambahkan kelas animasi
                reel.classList.add('shaking');
                
                // Durasi putaran tiap kolom berbeda agar berhenti satu per satu
                setTimeout(() => {
                    const randomSymbol = symbols[Math.floor(Math.random() * symbols.length)];
                    reel.innerText = randomSymbol;
                    reel.classList.remove('shaking');

                    // Cek hasil setelah kolom terakhir berhenti
                    if (index === reels.length - 1) {
                        checkResult();
                    }
                }, 1000 + (index * 500)); 
            });
        }

        function checkResult() {
            const results = reels.map(r => r.innerText);
            const allSame = results.every(val => val === results[0]);
            
            if (allSame) {
                statusText.innerText = "JACKPOT! 🎉";
                statusText.style.color = "#00ff00";
            } else {
                statusText.innerText = "Coba Lagi!";
                statusText.style.color = "#ffd700";
            }
            btn.disabled = false;
        }
    </script>
</body>
</html>
