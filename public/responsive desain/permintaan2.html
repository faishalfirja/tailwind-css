<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic Slot Machine</title>
    <style>
        :root {
            --reel-width: 80px;
            --reel-height: 120px;
            --symbol-height: 120px;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .slot-machine {
            background: linear-gradient(180deg, #444, #111);
            padding: 30px;
            border-radius: 20px;
            border: 5px solid #ffd700;
            box-shadow: 0 0 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,215,0,0.2);
            position: relative;
        }

        /* Jendela yang membatasi pandangan (Masking) */
        .reels-wrapper {
            display: flex;
            gap: 15px;
            background: #000;
            padding: 10px;
            border-radius: 10px;
            overflow: hidden; /* Penting: menyembunyikan simbol di luar box */
            border: 4px solid #222;
        }

        .reel-window {
            width: var(--reel-width);
            height: var(--reel-height);
            background: white;
            border-radius: 5px;
            overflow: hidden; /* Memotong strip simbol */
            position: relative;
        }

        /* Garis Penanda Tengah (Winning Line) */
        .reels-wrapper::after {
            content: "";
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: rgba(255, 0, 0, 0.3);
            transform: translateY(-50%);
            pointer-events: none;
        }

        /* Strip Simbol yang akan bergeser */
        .symbol-strip {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            transition: transform 3s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }

        .symbol {
            width: var(--reel-width);
            height: var(--symbol-height);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            user-select: none;
        }

        /* Tombol & UI */
        .controls {
            margin-top: 25px;
            text-align: center;
        }

        button {
            background: radial-gradient(circle, #ff0000, #990000);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px #600;
            transition: 0.1s;
        }

        button:active {
            box-shadow: 0 2px #600;
            transform: translateY(4px);
        }

        button:disabled {
            filter: grayscale(1);
            cursor: not-allowed;
        }

        #status {
            color: #ffd700;
            font-weight: bold;
            margin-top: 15px;
            font-size: 1.2rem;
            text-shadow: 0 0 5px black;
        }
    </style>
</head>
<body>

    <div class="slot-machine">
        <div class="reels-wrapper">
            <div class="reel-window"><div class="symbol-strip" id="strip1"></div></div>
            <div class="reel-window"><div class="symbol-strip" id="strip2"></div></div>
            <div class="reel-window"><div class="symbol-strip" id="strip3"></div></div>
            <div class="reel-window"><div class="symbol-strip" id="strip4"></div></div>
        </div>

        <div class="controls">
            <button onclick="spin()" id="spinBtn">PUTAR</button>
            <div id="status">KEBERUNTUNGAN MENANTIMU!</div>
        </div>
    </div>

    <script>
        const symbols = ['🍒', '🍋', '🍇', '7️⃣', '💎', '🔔', '🍀', '🍓'];
        const strips = [
            document.getElementById('strip1'),
            document.getElementById('strip2'),
            document.getElementById('strip3'),
            document.getElementById('strip4')
        ];
        
        // Inisialisasi tampilan awal
        function init() {
            strips.forEach(strip => {
                // Buat deretan simbol yang panjang (untuk efek putaran)
                let content = "";
                // Kita buat 20 simbol agar saat bergeser terlihat panjang
                for(let i=0; i<30; i++) {
                    const randomSym = symbols[Math.floor(Math.random() * symbols.length)];
                    content += `<div class="symbol">${randomSym}</div>`;
                }
                strip.innerHTML = content;
            });
        }

        function spin() {
            const btn = document.getElementById('spinBtn');
            const status = document.getElementById('status');
            btn.disabled = true;
            status.innerText = "BERPUTAR...";

            const results = [];

            strips.forEach((strip, i) => {
                // Tentukan simbol pemenang secara acak
                const targetIndex = Math.floor(Math.random() * symbols.length);
                const winningSymbol = symbols[targetIndex];
                results.push(winningSymbol);

                // Taruh simbol pemenang di posisi tertentu dalam strip (misal di urutan ke-25)
                const targetPosition = 25;
                const allSymbolDivs = strip.querySelectorAll('.symbol');
                allSymbolDivs[targetPosition].innerText = winningSymbol;

                // Hitung pergeseran pixel (120px adalah tinggi 1 simbol)
                const offset = targetPosition * 120;
                
                // Tambahkan delay tiap kolom agar berhenti bergantian
                setTimeout(() => {
                    strip.style.transition = `transform ${2 + (i * 0.5)}s cubic-bezier(0.45, 0.05, 0.55, 0.95)`;
                    strip.style.transform = `translateY(-${offset}px)`;
                }, 50);

                // Setelah selesai animasi, reset posisi secara instan agar bisa diputar lagi
                setTimeout(() => {
                    if (i === strips.length - 1) {
                        checkWin(results);
                        btn.disabled = false;
                    }
                }, 2000 + (strips.length * 500));
            });
        }

        function checkWin(results) {
            const status = document.getElementById('status');
            const allSame = results.every(v => v === results[0]);
            
            if (allSame) {
                status.innerText = "💥 JACKPOT BESAR! 💥";
                status.style.color = "#00ff00";
            } else {
                status.innerText = "COBA LAGI!";
                status.style.color = "#ffd700";
            }
            
            // Reset posisi strip secara halus untuk putaran berikutnya (opsional)
            // Dalam kode sederhana ini, user perlu refresh jika ingin posisi strip kembali ke atas, 
            // atau kita bisa memodifikasi logika reset posisi di sini.
        }

        init();
    </script>
</body>
</html>
