<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="ml-40 mt-20 bg-sky-500 hover:bg-sky-700 hover:text-red-300">
    save changes
    </button>
    <button class="bg-sky-500 focus:bg-green-500">save changes</button>
    <button class="bg-sky-500 active:bg-red-700">save changes</button>
</body>
<body>
    <form action="">
        <label for="email" class="">
            <span class="">Username</span>
            <input
            required
            type="email"
            id="email"
            class="block w-full rounded border px-3 py-2 text-sm shadow required:bg-red-400"
            placeholder="masukkan email "
            />
        </label>
    </form>
    <input
        type="kata sandi"
        id="kata sandi"
        class="block w-full rounded px-3 py-2 text-sm shadow invalid:text-red-500"
        placeholder="masukkan kata sandi"
    />
    <input
        disabled
        type="email"
        id="email"
        class="block w-full rounded border px-3 py-2 text-sm shadow disabled:bg-red-500 disabled:placeholder:text-blue-500"
        placeholder="masukkan email dan kata sandi"
    />
    <div class="group/parent mx-auto mt-20 h-40 w-40 bg-black flex items-center">
        <div class="=group/child mx-auto h-20 w-20 bg-sky-50 group-hover/parent:bg-green-400 pt-5">
            <div class="group-hover/child:bg-yellow-200 h-10 w-10 bg-red-200 mx-auto"> save </div>
        </div>
    </div>
    <div>
        <div class="peer h-20 w-20 bg-green-200"></div>
        <div class="h-20 w-20 bg-red-200 peer-hover:bg-gray-900 invisible peer-hover:visible"></div>
    </div>
</body>
</html>
