<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Home - Website Utama</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 0; }
        header { background: #333; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center; }
        
        .nav-login { color: white; text-decoration: none; font-weight: bold; padding: 5px 10px; border: 1px solid white; border-radius: 4px; }
        .nav-login:hover { background: white; color: #333; }

        .parent-box { 
            margin: 50px; padding: 20px; border: 2px dashed #ccc; text-align: center; transition: 0.3s;
        }
        .parent-box:hover { border-color: #007bff; background: #f9f9f9; }
        .parent-box:hover h3 { color: #007bff; }
        .parent-box:hover p { font-weight: bold; }
    </style>
</head>
<body>

<header>
    <div class="logo">MULTINET</div>
    <nav>
        <a href="login.html" class="nav-login">Login</a>
    </nav>
</header>

<main>
    <div class="parent-box">
        <h3>Selamat Datang!</h3>
        <p>Arahkan kursor ke kotak ini untuk melihat efek styling "Parent State".</p>
    </div>
</main>

</body>
</html>
