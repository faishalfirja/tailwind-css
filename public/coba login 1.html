<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #f4f4f4; }
        .login-card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        input:focus { border-color: #007bff; outline: none; background-color: #f0f7ff; }

        input:disabled { background-color: #e9e9e9; cursor: not-allowed; }

        input:invalid { border: 2px solid red; }

        button { 
            width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; 
            border-radius: 4px; cursor: pointer; transition: 0.3s; 
        }
        button:hover { background-color: #0056b3; } 
        button:active { background-color: #004085; transform: scale(0.98); } 

        .back-link { display: block; margin-top: 15px; text-align: center; color: #666; text-decoration: none; font-size: 14px; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Login</h2>
    <form>
        <label>ID User (Auto):</label>
        <input type="text" value="USR-2024" disabled>

        <label>Email:</label>
        <input type="email" placeholder="Masukkan email" required>

        <label>Username:</label>
        <input type="text" placeholder="Username" required>

        <label>Password:</label>
        <input type="password" placeholder="Password" required>

        <button type="submit">Masuk</button>
    </form>
    <a href="index.html" class="back-link">Kembali ke Home</a>
</div>

</body>
</html>
